<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewind To Silence · Card Database</title>
  <link rel="icon" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
  <script>
    // old links like /#blaze-end-dragon opened a card; keep them working
    if (location.hash.length > 1) location.replace('cards.html' + location.hash);
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><img src="logo.jpg" alt="RTS"><h1>Rewind To Silence <span>Card Database</span></h1></a>
    <nav><a href="cards.html">Cards</a><a href="sets.html">Sets</a></nav>
  </header>

  <main class="home">
    <section class="hero">
      <img src="logo.jpg" alt="Rewind To Silence">
      <h2>Rewind To Silence</h2>
      <p>Custom Card Database</p>
    </section>

    <section class="hubs">
      <a class="hub" href="cards.html">
        <span class="hub-icon i-search" role="img" aria-label="Card search"></span>
        <h3>Card Search</h3>
        <p>Search and filter every card by name, type, attribute, archetype and more.</p>
        <span class="hub-count" id="cardCount">&nbsp;</span>
      </a>
      <a class="hub" href="sets.html">
        <span class="hub-icon i-sets" role="img" aria-label="Sets"></span>
        <h3>Sets</h3>
        <p>Browse the card sets and open the full list of cards in each one.</p>
        <span class="hub-count" id="setCount">&nbsp;</span>
      </a>
    </section>
  </main>

  <script src="common.js"></script>
  <script>
    RTS.loadData().then(({ sets, cards }) => {
      document.getElementById('cardCount').textContent = RTS.plural(cards.length, 'card');
      document.getElementById('setCount').textContent = RTS.plural(sets.length, 'set');
    }).catch(() => {
      document.getElementById('cardCount').textContent = 'Browse cards';
      document.getElementById('setCount').textContent = 'Browse sets';
    });
  </script>
</body>
</html>
